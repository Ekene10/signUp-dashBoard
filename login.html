<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f4f5fb;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #111827;
    }

    input[type="text"], input[type="password"] {
        display: block;
        width: 100%;
        max-width: 360px;
        padding: 12px 14px;
        margin-bottom: 16px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #fff;
        font-family: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79,70,229,.15);
    }

    button[type="button"] {
        display: block;
        width: 100%;
        max-width: 360px;
        padding: 12px 20px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: background .2s;
        margin-bottom: 20px;
    }

    button[type="button"]:hover {
        background: #4338ca;
    }

    p {
        font-size: 14px;
        color: #4b5563;
        margin: 0;
    }

    a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: 600;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
<body>
    <input type="text" id="email" placeholder="Enter your Email">
    <input type="password" placeholder="Enter your password" id="password">
    <button type="button" onclick="logIn()">Log In</button>
     <p>Don't have an account?
            <a href="index.html">Sign Up</a>
    </p>
</body>
<script>
    let users = JSON.parse(localStorage.getItem('userPractice')) || []
    function logIn() {
        let emailField = document.getElementById('email').value.trim()
        let passwordField = document.getElementById('password').value.trim()

        if (!emailField || !passwordField) {
            alert('All fields are mandatory brochacho')
        } else {
            let foundUser = users.find((user) =>{ return user.email === emailField})
            let foundUserIndex = users.find((user)=>{return user.email === emailField})
            if (!foundUser) {
                alert('Account doesnt exist, try signing up Brochacho')
            } else {
                if (foundUser.passWord !== passwordField) {
                    alert('invalid credentials')
                } else {
                    alert('login Succesful')
                    localStorage.setItem('currentUserIndex', JSON.stringify(foundUserIndex))
                    window.location.href ='dashBoard.html'
                }
            }
        }
    }
</script>
</html>
