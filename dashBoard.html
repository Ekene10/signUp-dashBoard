<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * { box-sizing: border-box; }

body {
    margin: 0;
    padding-bottom: 40px;
    background: #f4f5fb;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #111827;
}

/* ---------- Header ---------- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 32px;
    margin-bottom: 32px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 10;
}
header div { font-weight: 800; font-size: 20px; }
header div::first-letter {
    background: #4f46e5;
    color: #fff;
    padding: 4px 10px;
    border-radius: 10px;
}
header button {
    background: #fff;
    color: #111827;
    border: 1px solid #d1d5db;
}

/* ---------- Cards ---------- */
.container, #output {
    width: 640px;
    max-width: calc(100% - 32px);
    margin: 0 auto 24px;
}

.container {
    padding: 28px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(79,70,229,.06);
}

.container h1 { margin: 0; font-size: 28px; }

/* second card: "Title" and "Content" become small labels */
.container:nth-of-type(2) h1 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.container:nth-of-type(2) > p { font-size: 14px; font-weight: 700; margin: 18px 0 8px; }

/* ---------- Inputs ---------- */
input[type="text"], textarea {
    display: block;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    background: #fff;
    font-family: inherit;
    font-size: 15px;
    outline: none;
}

textarea { min-height: 150px; resize: vertical; }

input:focus, textarea:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79,70,229,.2);
}

/* ---------- Buttons ---------- */
button {
    padding: 10px 20px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
}
button:hover { background: #4338ca; }

.container button { display: block; margin: 18px 0 0 auto; }

/* ---------- "Recent posts" heading ---------- */
body > div:not([class]):not([id]) {
    width: 640px;
    max-width: calc(100% - 32px);
    margin: 0 auto 12px;
}
body > div:not([class]):not([id]) p:first-child { margin: 0; font-size: 22px; font-weight: 800; }
body > div:not([class]):not([id]) p:last-child { display: none; }

.post {
    margin-bottom: 18px;
    padding: 24px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(79,70,229,.06);
}
.post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #e0e7ff;
    color: #4f46e5;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}
.author { font-weight: 700; }
.date { font-size: 13px; color: #6b7280; }
.post h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
.post p { margin: 0; line-height: 1.6; color: #374151; }

/* ---------- Your static post cards ---------- */
.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post-header p { margin: 0; line-height: 1.6; color: #374151; }
.profile-pic { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.post-image { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; }

.container .buttons { display: flex; gap: 10px; margin-top: 14px; }
.container .buttons button {
    margin: 0;
    background: #eef2ff;
    color: #4f46e5;
}
.container .buttons button:hover { background: #e0e7ff; }
</style>
<body>
    <header><div>B <span>myBlog</span></div> <button onclick="logOut()">Log Out</button></header>
<div class="container">
     <h1>Welcome</h1>
  </div>
<div class="container">
     <h1>Title</h1>
     <input type="text" id="inputTitle">
     <p>Content</p>
     <textarea name="text" id="textArea" placeholder="Write your post here..." id="textPost"></textarea>
     <button onclick="post()">Post</button>
 </div>
 <div>

</html>
